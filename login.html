<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savoré - Login / Sign Up</title>
    <style>
        :root {
            --bg-dark: #2B1612;      
            --gold-accent: #E2B75A;  
            --text-light: #FFFFFF;
            --text-muted: #A8A8A8;
            --input-bg: #4A3A36;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            height: 100vh;
        }

        .left-panel {
            flex: 1;
            background: url('images/login.jpg') no-repeat center center/cover;
            position: relative;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2));
        }

        /* Back Button Style */
        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 20;
            color: var(--text-light);
            background-color: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--gold-accent);
            color: var(--bg-dark);
        }

        .quote {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            max-width: 80%;
        }

        .quote p {
            font-style: italic;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .quote span {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
        }

        .logo {
            color: var(--gold-accent);
            font-size: 1.5rem;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .title {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 30px;
        }

        .toggle-container {
            display: flex;
            background-color: #E0E0E0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            width: fit-content;
        }

        .toggle-btn {
            padding: 10px 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: transparent;
            color: #333;
            transition: background 0.3s;
        }

        .toggle-btn.active {
            background-color: var(--gold-accent);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background-color: var(--input-bg);
            color: var(--text-light);
        }

        .forgot-password {
            text-align: right;
            display: block;
            margin-top: -10px;
            margin-bottom: 20px;
            color: var(--gold-accent);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--gold-accent);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .footer-text {
            text-align: center;
            font-size: 0.85rem;
        }

        .footer-text a {
            color: var(--gold-accent);
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <!-- Back to Home Button -->
        <a href="index.html" class="back-btn">← Back to Home</a>

        <div class="quote">
            <p>"The finest ingredients, the greatest care."</p>
            <span>— Chef Mahendra Silva</span>
        </div>
    </div>

    <div class="right-panel">
        <div class="logo">Savoré</div>
        
        <!-- Login Form -->
        <div id="login-form">
            <h1 class="title">Welcome back</h1>
            <p class="subtitle">Sign in to your account</p>
            
            <div class="toggle-container">
                <button class="toggle-btn active">Login</button>
                <button class="toggle-btn" onclick="toggleForm('signup')">Sign Up</button>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="you@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••••">
            </div>
            <a href="#" class="forgot-password">Forgot Password?</a>
            <button class="submit-btn">SIGN IN</button>
            <p class="footer-text">Don't have an account? <a href="#" onclick="toggleForm('signup')">Sign up</a></p>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="hidden">
            <h1 class="title">Create account</h1>
            <p class="subtitle">Join the Savoré family today</p>
            
            <div class="toggle-container">
                <button class="toggle-btn" onclick="toggleForm('login')">Login</button>
                <button class="toggle-btn active">Sign Up</button>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Arjun Perera">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="you@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••••">
            </div>
            <button class="submit-btn">CREATE ACCOUNT</button>
            <p class="footer-text">Already have an account? <a href="#" onclick="toggleForm('login')">Login here</a></p>
        </div>
    </div>

    <script>
        function toggleForm(formType) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            if (formType === 'signup') {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
